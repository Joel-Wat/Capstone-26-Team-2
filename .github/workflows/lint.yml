---

name: Lint

"on":
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: monday-vendor-form/package-lock.json

      - name: Install dependencies
        working-directory: ./monday-vendor-form
        run: npm ci

      - name: Run ESLint
        working-directory: ./monday-vendor-form
        run: npm run lint

      - name: Run Prettier
        working-directory: ./monday-vendor-form
        run: npm run format

      - name: Lint YAML
        uses: ibiqlik/action-yamllint@v3
        