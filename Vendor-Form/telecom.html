<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vendor-form</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body class="formPage">
    <div id="root">
      <h1>GP26 Telecommunications Order Form</h1>
      <form id="vendorForm">
        <p>
          <label for="department">AGPC Department</label>
          <small style="display: block; color: #888; margin-bottom: 5px; font-size: 0.8em;">Enter the relevant Grand Prix Department.</small>
          <select id="department" name="department" required>
            <option value=""></option>
            <option value="Option 1">Commercial Partnerships & Sales</option>
            <option value="Option 2">Coporate Affiars & ESG</option>
            <option value="Option 3">Digital</option>
            <option value="Option 4">Executive</option>
            <option value="Option 5">Finance</option>
            <option value="Option 6">Legal</option>
            <option value="Option 7">Marketing & Brand</option>
            <option value="Option 8">Motorsport</option>
            <option value="Option 9">Operations (Safety)</option>
            <option value="Option 10">Operations (Accreditation)</option>
            <option value="Option 11">Operations (Customer)</option>
            <option value="Option 12">Operations (Infrastructure)</option>
            <option value="Option 13">Operations (Venue)</option>
            <option value="Option 14">People Culture & Capability</option>
            <option value="Option 15">Technology</option>
            <option value="Option 16">Ticketing & Commercial Operations</option>


          </select>
        </p>

        <p>
          <label for="emac-number">EMAC Number <span style="color: red;">*</span></label>
          <small style="display: block; color: #888; margin-bottom: 5px; font-size: 0.8em;">Enter the relevant EMAC reference number.</small>
          <input
            type="text"
            id="emac-number"
            name="emacNumber"
            inputmode="numeric"
            required
            pattern="[0-9]+"
          />
        </p>

        <p>
          <label for="emac-facility-name">EMAC/Facility Name <span style="color: red;">*</span></label>
          <small style="display: block; color: #888; margin-bottom: 5px; font-size: 0.8em;">Enter the relevant EMAC/Facility Name.</small>
          <input
            type="text"
            id="emac-facility-name"
            name="facilityName"
            required
          />
        </p>

        <p>
          <label for="connection-date">Required Connection Date <span style="color: red;">*</span></label>
          <input
            type="date"
            id="connection-date"
            name="connectionDate"
            placeholder="dd/mm/yyyy"
            required
          />
        </p>

        <p>
          <label for="disconnection-date">Required Disconnection Date <span style="color: red;">*</span></label>
          <input
            type="date"
            id="disconnection-date"
            name="disconnectionDate"
            placeholder="dd/mm/yyyy"
            required
          />
        </p>

        <p class="buttonContainer">
          <button class="back" type="button" id="backBtn">Back</button>
          <button type="submit">Continue</button>
        </p>
      </form>
    </div>

    <script>
      const form = document.getElementById("vendorForm");

      const params = new URLSearchParams(window.location.search);
      const token = params.get("token");

      document.getElementById("backBtn").addEventListener("click", () => {
        const serviceAnswers = Object.fromEntries(new FormData(form));

        sessionStorage.setItem(
          "serviceAnswers",
          JSON.stringify(serviceAnswers),
        );

        window.location.href = `index.html?token=${encodeURIComponent(token)}`;
      });

      const savedAnswers = JSON.parse(
        sessionStorage.getItem("serviceAnswers") || "{}",
      );

      for (const [name, value] of Object.entries(savedAnswers)) {
        const field = form.elements.namedItem(name);

        if (field && "value" in field) {
          field.value = value;
        }
      }

      form.addEventListener("submit", (event) => {
        event.preventDefault();

        if (!token) {
          alert("Invalid form link.");
          return;
        }

        const contactDetails = JSON.parse(
          sessionStorage.getItem("contactDetails"),
        );

        if (!contactDetails) {
          alert("Contact details could not be found.");
          return;
        }

        const serviceAnswers = Object.fromEntries(new FormData(event.target));

        sessionStorage.setItem(
          "serviceAnswers",
          JSON.stringify(serviceAnswers),
        );

        window.location.href = `Confirmation.html?token=${encodeURIComponent(token)}`;
      });
    </script>
  </body>
</html>
