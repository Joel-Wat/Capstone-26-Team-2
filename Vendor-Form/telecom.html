<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vendor-form</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body class="formPage">
    <div id="root">
      <h1>GP26 Telecommunications Order Form</h1>
      <form id="vendorForm">
        <p>
          <label for="department">AGPC Department</label>
          <select id="department" name="department" required>
            <option value=""></option>
            <option value="Option 1">Option 1</option>
            <option value="Option 2">Option 2</option>
            <option value="Option 3">Option 3</option>
          </select>
        </p>

        <p>
          <label for="emac-number">EMAC Number *</label>
          <input type="text" id="emac-number" name="emacNumber" required />
        </p>

        <p>
          <label for="emac-facility-name">EMAC/Facility Name *</label>
          <input
            type="text"
            id="emac-facility-name"
            name="facilityName"
            required
          />
        </p>

        <p>
          <label for="connection-date">Required Connection Date *</label>
          <input
            type="date"
            id="connection-date"
            name="connectionDate"
            placeholder="dd/mm/yyyy"
            required
          />
        </p>

        <p>
          <label for="disconnection-date">Required Disconnection Date *</label>
          <input
            type="date"
            id="disconnection-date"
            name="disconnectionDate"
            placeholder="dd/mm/yyyy"
            required
          />
        </p>

        <p class="buttonContainer"><button type="submit">Continue</button></p>
      </form>
    </div>

    <script>
      const form = document.getElementById("vendorForm");

      const params = new URLSearchParams(window.location.search);
      const token = params.get("token");

      form.addEventListener("submit", (event) => {
        event.preventDefault();

        if (!token) {
          alert("Invalid form link.");
          return;
        }

        const contactDetails = JSON.parse(
          sessionStorage.getItem("contactDetails"),
        );

        if (!contactDetails) {
          alert("Contact details could not be found.");
          return;
        }

        const serviceAnswers = Object.fromEntries(new FormData(event.target));

        sessionStorage.setItem(
          "serviceAnswers",
          JSON.stringify(serviceAnswers),
        );

        window.location.href = `Confirmation.html?token=${encodeURIComponent(token)}`;
      });
    </script>
  </body>
</html>
