<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vendor-form</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="confPage">
    <div id="root">
      <h1 id="pageTitle">Review</h1>

      <div id="summary"></div>

      <p class="buttonContainer">
        <button class="back" type="button" id="backBtn">Back</button>
        <button class="fin" type="button" id="submitBtn">Submit</button>
      </p>
    </div>

    <script>
      const summary = document.getElementById("summary");
      const submitBtn = document.getElementById("submitBtn");

      const params = new URLSearchParams(window.location.search);
      const token = params.get("token");

      const contactDetails = JSON.parse(
        sessionStorage.getItem("contactDetails"),
      );

      const serviceAnswers = JSON.parse(
        sessionStorage.getItem("serviceAnswers"),
      );

      let data;

      //checls if the there is details and answers
      if (contactDetails && serviceAnswers) {
        data = {
          ...contactDetails,
          ...serviceAnswers,
        };
      } else {
        data = null;
      }

      //Making the data prettier when shown!
      const fieldLabels = {
        contactName: "Contact Name",
        phone: "Contact Number",
        email: "Email Address",
        service: "Service",
        department: "AGPC Department",
        emacNumber: "EMAC Number",
        emacDescription: "EMAC Description",
        additionalInfo: "Additional Information",
        facilityName: "EMAC/Facility Name",
        connectionDate: "Required Connection Date",
        disconnectionDate: "Required Disconnection Date",
      };

      //error checker
      if (!data || !token) {
        summary.textContent = "Form information or token could not be found.";
        submitBtn.disabled = true;
      } else {
        for (const [key, value] of Object.entries(data)) {
          const p = document.createElement("p");
          const labelEl = document.createElement("label");
          const valueEl = document.createElement("label");

          labelEl.textContent = fieldLabels[key] || key;
          valueEl.textContent = value;

          p.append(labelEl, valueEl);
          summary.append(p);
        }
      }
      // Sends to user back to the page they came from if they click the back button
      document.getElementById("backBtn").addEventListener("click", () => {
        history.back();
      });

      submitBtn.addEventListener("click", async () => {
        try {
          submitBtn.disabled = true;

          const response = await fetch(
            `http://localhost:3000/api/forms/${encodeURIComponent(token)}/submit`,
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({
                answers: data,
              }),
            },
          );

          const result = await response.json();

          if (!response.ok) {
            alert(result.error || "Could not submit form.");
            submitBtn.disabled = false;
            return;
          }

          sessionStorage.removeItem("contactDetails");
          sessionStorage.removeItem("serviceAnswers");

          window.location.href = `https://grandprixecosystems.web.app/submit.html?token=${encodeURIComponent(token)}`;
        } catch (error) {
          console.error("Error submitting form:", error);
          alert("Could not connect to the backend.");
          submitBtn.disabled = false;
        }
      });
    </script>
  </body>
</html>
