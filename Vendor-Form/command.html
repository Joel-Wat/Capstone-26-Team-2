<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vendor-form</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body class="formPage">
    <div id="root">
      <h1>GP26 Command</h1>
      <form id="vendorForm">
        <p>
          <label for="emac-number">EMAC Number *</label>
          <input
            type="text"
            id="emac-number"
            name="emacNumber"
            inputmode="numeric"
            required
            pattern="[0-9]+"
          />
        </p>
        <p>
          <label for="emac-description">EMAC Description *</label>
          <input
            type="text"
            id="emac-description"
            name="emacDescription"
            required
          />
        </p>
        <p>
          <label for="additional-info">Additional Information *</label>
          <input
            type="text"
            id="additional-info"
            name="additionalInfo"
            required
          />
        </p>
        <div class="fileUpload">
  <label for="serviceSketch">Location/Service Sketch *</label>

  <label for="serviceSketch" class="uploadBox">
    <span class="uploadIcon">⇧</span>
    <span class="uploadText">Choose a file to upload</span>
    <span class="uploadHint">PNG, JPG or PDF (Max 5 MB)</span>
  </label>

  <input
    type="file"
    id="serviceSketch"
    name="serviceSketch"
    accept=".png,.jpg,.jpeg,.pdf"
    required
  />
</div> <p class="buttonContainer">
          <button class="back" type="button" id="backBtn">Back</button>
          <button type="submit" id="continueBtn">Continue</button>
        </p>
      </form>
    </div>

    <script>
      const form = document.getElementById("vendorForm");
      const fileInput = document.getElementById("serviceSketch");

fileInput.addEventListener("change", () => {
  const selectedFile = fileInput.files[0];

  const maxFileSize = 5 * 1024 * 1024;
  const allowedTypes = [
    "image/jpeg",
    "image/png",
    "application/pdf",
  ];

  if (!selectedFile) {
    return;
  }

  if (selectedFile.size > maxFileSize) {
    alert("File must be smaller than 5 MB");
    fileInput.value = "";
    return;
  }

  if (!allowedTypes.includes(selectedFile.type)) {
    alert("Only PNG, JPG and PDF files are allowed");
    fileInput.value = "";
    return;
  }
});
      const params = new URLSearchParams(window.location.search);
      const token = params.get("token");

      document.getElementById("backBtn").addEventListener("click", () => {
        const serviceAnswers = Object.fromEntries(new FormData(form));
        
        delete serviceAnswers.serviceSketch;
        sessionStorage.setItem(
          "serviceAnswers",
          JSON.stringify(serviceAnswers),
        );

        window.location.href = `index.html?token=${encodeURIComponent(token)}`;
      });

      const savedAnswers = JSON.parse(
        sessionStorage.getItem("serviceAnswers") || "{}",
      );

      for (const [name, value] of Object.entries(savedAnswers)) {
        const field = form.elements.namedItem(name);

        if (field && "value" in field) {
          field.value = value;
        }
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        if (!token) {
          alert("Invalid form link.");
          return;
        }

        const serviceAnswers = Object.fromEntries(new FormData(event.target));
        delete serviceAnswers.serviceSketch;

        sessionStorage.setItem(
          "serviceAnswers",
          JSON.stringify(serviceAnswers),
        );
        const selectedFile = fileInput.files[0];

if (!selectedFile) {
  alert("Please upload a Location/Service Sketch");
  return;
}

const uploadData = new FormData();
uploadData.append("serviceSketch", selectedFile);

try {
  const response = await fetch(
    `https://c1b48-service-36976642-e877d2ab.au.monday.app/api/forms/${encodeURIComponent(token)}/upload`,
    {
      method: "POST",
      body: uploadData,
    },
  );

  if (!response.ok) {
    alert("File upload failed. Please try again.");
    return;
  }
} catch (error) {
  console.error("Upload error:", error);
  alert("Could not connect to the server.");
  return;
}
finally {
  continueBtn.disabled = false;
}

        window.location.href = `https://grandprixecosystems.web.app/Confirmation.html?token=${encodeURIComponent(token)}`;
      });
    </script>
  </body>
</html>
