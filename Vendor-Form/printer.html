<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vendor-form</title>
<link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body class="formPage">
    <div id="root">
      <h1>GP26 Printers</h1>

      <form id="vendorForm">
        <p>
          <label for="emac-number">
            EMAC Number <span style="color: red">*</span>
          </label>
          <small
            style="
              display: block;
              color: #888;
              margin-bottom: 5px;
              font-size: 0.8em;
            "
          >
            Enter the EMAC reference number provided for your printer or
            equipment request.
          </small>
          <input
            type="text"
            id="emac-number"
            name="emacNumber"
            inputmode="numeric"
            required
            pattern="[0-9]+"
          />
        </p>

        <div class="fileUpload">
          <label for="serviceSketch">
            Location/Service Sketch <span style="color: red">*</span>
          </label>
          <small
            style="
              display: block;
              color: #888;
              margin-bottom: 5px;
              font-size: 0.8em;
            "
          >
            Upload a floor plan, map, or sketch showing where the printer or
            equipment should be installed or delivered. Accepted formats: PNG,
            JPG, or PDF (maximum 5 MB).
          </small>

          <input
            type="file"
            id="serviceSketch"
            name="serviceSketch"
            accept=".png,.jpg,.jpeg,.pdf"
            required
          />
        </div>

        <p class="buttonContainer">
          <button class="back" type="button" id="backBtn">Back</button>
          <button type="submit" id="continueBtn">Continue</button>
        </p>
      </form>
    </div>

    <script>
      const form = document.getElementById("vendorForm");
      const fileInput = document.getElementById("serviceSketch");
      const continueBtn = document.getElementById("continueBtn");

      fileInput.addEventListener("change", () => {
        const selectedFile = fileInput.files[0];

        const maxFileSize = 5 * 1024 * 1024;
        const allowedTypes = ["image/jpeg", "image/png", "application/pdf"];

        if (!selectedFile) {
          return;
        }

        if (selectedFile.size > maxFileSize) {
          alert("File must be smaller than 5 MB");
          fileInput.value = "";
          return;
        }

        if (!allowedTypes.includes(selectedFile.type)) {
          alert("Only PNG, JPG and PDF files are allowed");
          fileInput.value = "";
          return;
        }

        sessionStorage.setItem("serviceSketchName", selectedFile.name);
      });

      const params = new URLSearchParams(window.location.search);
      const token = params.get("token");

      document.getElementById("backBtn").addEventListener("click", () => {
        const serviceAnswers = Object.fromEntries(new FormData(form));
        delete serviceAnswers.serviceSketch;

        sessionStorage.setItem(
          "serviceAnswers",
          JSON.stringify(serviceAnswers),
        );

        window.location.href = `index.html?token=${encodeURIComponent(token)}`;
      });

      const savedAnswers = JSON.parse(
        sessionStorage.getItem("serviceAnswers") || "{}",
      );

      for (const [name, value] of Object.entries(savedAnswers)) {
        const field = form.elements.namedItem(name);

        if (field && field.type !== "file" && "value" in field) {
          field.value = value;
        }
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        if (!token) {
          alert("Invalid form link.");
          return;
        }

        const serviceAnswers = Object.fromEntries(new FormData(event.target));

        delete serviceAnswers.serviceSketch;

        sessionStorage.setItem(
          "serviceAnswers",
          JSON.stringify(serviceAnswers),
        );

        const selectedFile = fileInput.files[0];

        if (!selectedFile) {
          alert("Please upload a Location/Service Sketch");
          return;
        }

        const maxFileSize = 5 * 1024 * 1024;
        const allowedTypes = ["image/jpeg", "image/png", "application/pdf"];

        if (
          selectedFile.size > maxFileSize ||
          !allowedTypes.includes(selectedFile.type)
        ) {
          alert("Please select a valid PNG, JPG or PDF file under 5 MB.");
          return;
        }

        const uploadData = new FormData();
        uploadData.append("serviceSketch", selectedFile);

        continueBtn.disabled = true;

        try {
          const response = await fetch(
            `https://c1b48-service-36976642-e877d2ab.au.monday.app/api/forms/${encodeURIComponent(token)}/upload`,
            {
              method: "POST",
              body: uploadData,
            },
          );

          if (!response.ok) {
            alert("File upload failed. Please try again.");
            return;
          }

          window.location.href = `Confirmation.html?token=${encodeURIComponent(token)}`;
        } catch (error) {
          console.error("Upload error:", error);
          alert("Could not connect to the server.");
        } finally {
          continueBtn.disabled = false;
        }
      });
    </script>
  </body>
</html>
