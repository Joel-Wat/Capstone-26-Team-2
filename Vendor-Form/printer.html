<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vendor-form</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body class="formPage">
    <div id="root">
      <h1>GP26 Printers</h1>
      <form id="vendorForm">
        <p>
          <label for="emac-number">EMAC Number <span style="color: red;">*</span></label>
          <input type="text" id="emac-number" name="emacNumber" oninput="this.value = this.value.replace(/[^0-9]/g, '')" required />
        </p>

        <p class="buttonContainer">
          <button class="back" type="button" id="backBtn">Back</button>
          <button type="submit">Continue</button>
        </p>
      </form>
    </div>

    <script>
      const form = document.getElementById("vendorForm");

      const params = new URLSearchParams(window.location.search);
      const token = params.get("token");

      document.getElementById("backBtn").addEventListener("click", () => {
        const serviceAnswers = Object.fromEntries(new FormData(form));

        sessionStorage.setItem(
          "serviceAnswers",
          JSON.stringify(serviceAnswers),
        );

        window.location.href = `index.html?token=${encodeURIComponent(token)}`;
      });

      const savedAnswers = JSON.parse(
        sessionStorage.getItem("serviceAnswers") || "{}",
      );

      for (const [name, value] of Object.entries(savedAnswers)) {
        const field = form.elements.namedItem(name);

        if (field && "value" in field) {
          field.value = value;
        }
      }

      form.addEventListener("submit", (event) => {
        event.preventDefault();

        if (!token) {
          alert("Invalid form link.");
          return;
        }

        const serviceAnswers = Object.fromEntries(new FormData(event.target));

        sessionStorage.setItem(
          "serviceAnswers",
          JSON.stringify(serviceAnswers),
        );

        window.location.href = `https://grandprixecosystems.web.app/Confirmation.html?token=${encodeURIComponent(token)}`;
      });
    </script>
  </body>
</html>
