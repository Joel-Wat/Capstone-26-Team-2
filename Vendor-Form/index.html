<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vendor-form</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="formPage">
    <div id="root">
      <h1>GP26<br />DYNAMIC FORM</h1>
      <form id="vendorForm">
        <p>
          <label for="name">Contact Name *</label>
          <input id="name" type="text" required />
        </p>
        <p>
          <label for="phone">Contact Number *</label>
          <input id="phone" type="text" required />
        </p>
        <p>
          <label for="email">Email Address *</label>
          <input id="email" type="email" required />
        </p>
        <p>
          <label for="service">Select a service *</label>
          <input id="service" list="services" placeholder="Search" required />
          <datalist id="services">
            <option value="Telecommunications"></option>
            <option value="Printer & Equipment"></option>
            <option value="Event Technology"></option>
            <option value="Phones"></option>
          </datalist>
        </p>
        <p class="buttonContainer"><button type="submit">Continue</button></p>
      </form>
    </div>

    <script>
      const form = document.getElementById("vendorForm");
      const service = document.getElementById("service");

      const params = new URLSearchParams(window.location.search);
      const token = params.get("token");

      form.addEventListener("submit", (event) => {
        event.preventDefault();

        if (!token) {
          alert("Invalid form link.");
          return;
        }

        const selectedService = service.value;

        const contactDetails = {
          contactName: document.getElementById("name").value,
          phone: document.getElementById("phone").value,
          email: document.getElementById("email").value,
          service: selectedService,
        };

        sessionStorage.setItem(
          "contactDetails",
          JSON.stringify(contactDetails),
        );

        if (selectedService === "Telecommunications") {
          window.location.href = `telecom.html?token=${token}`;
        } else if (selectedService === "Printer & Equipment") {
          window.location.href = `printer.html?token=${token}`;
        } else if (selectedService === "Event Technology") {
          window.location.href = `command.html?token=${token}`;
        } else if (selectedService === "Phones") {
          window.location.href = `phone.html?token=${token}`;
        } else {
          alert("Please select a valid service.");
        }
      });
    </script>
  </body>
</html>
